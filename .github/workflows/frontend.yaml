name: Frontend Pipeline

on:
  push:
    branches:
      - SIP-73-armar-deployment-en-cloud
    paths:
      - frontend/**

env:
  IMAGE_NAME: matiasherrneder/mipla-frontend

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set Image Tag
        id: vars
        run: echo "TAG=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Docker Image
        run: |
          docker build -t $IMAGE_NAME:${{ steps.vars.outputs.TAG }} ./frontend/mypla
          docker push $IMAGE_NAME:${{ steps.vars.outputs.TAG }}

      - name: Update Kubernetes Manifests
        run: |
          sed -i "s|image: .*|image: $IMAGE_NAME:${{ steps.vars.outputs.TAG }}|" deploy/frontend/k8s.yaml
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git add deploy/frontend/k8s.yaml
          git commit -m "Update image to $IMAGE_NAME:${{ steps.vars.outputs.TAG }}"
          git push